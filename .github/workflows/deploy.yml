name: deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Config
        uses: actions/configure-pages@v6

      - name: Configure path
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY##*/}"
          if [[ "$repo" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            echo "BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$repo" >> "$GITHUB_ENV"
          fi

      - name: Build
        id: gallery
        uses: $/.github/actions/build-gallery
        with:
          gh_pat: ${{ secrets.GH_PAT }}
          is_reuse_translator: ${{ github.event_name == 'push' }}

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.gallery.outputs.build-path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
