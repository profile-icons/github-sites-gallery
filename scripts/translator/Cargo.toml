[package]
name = "gallery-translator"
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
publish = false

[dependencies]
anyhow = "1"
ort = "=2.0.0-rc.15"
ort-sys = "=2.0.0-rc.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
ureq = "3.5"

[toolchain]
channel = "1.100.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
